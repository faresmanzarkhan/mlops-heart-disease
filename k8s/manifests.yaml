apiVersion: v1
kind: Namespace
metadata:
  name: heart-disease
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-api
  namespace: heart-disease
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heart-api
  template:
    metadata:
      labels:
        app: heart-api
    spec:
      containers:
      - name: api
        image: assignment1-heart-api:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: heart-api
  namespace: heart-disease
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    nodePort: 31763
  selector:
    app: heart-api
